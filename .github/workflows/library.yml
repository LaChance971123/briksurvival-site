name: Verify knowledge library
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-build.txt
      - run: python scripts/build_library.py
      - run: python scripts/verify_library.py
      - run: node --check app.js && node --check search.js
      - run: node scripts/verify_search.cjs
