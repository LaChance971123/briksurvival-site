[build]
  publish = "dist"
  command = "pip install -r requirements-build.txt && python scripts/build_site.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/Assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Preserve the old entry point as guidance, with no document download.
[[redirects]]
  from = "/blackout-checklist-confirmed"
  to = "/blackout-checklist-confirmed.html"
  status = 301
  force = true

# Retire the abandoned Brik homepage experiment without exposing stale branding.
[[redirects]]
  from = "/indexv3.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/offline/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/offline/"

[[headers]]
  for = "/offline/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

# File shadowing deliberately keeps only /offline/index.html and the retirement
# worker reachable. Removed reader data and scripts receive the retirement page.
[[redirects]]
  from = "/offline/guides.json"
  to = "/retired-downloads.html"
  status = 404
  force = true

[[redirects]]
  from = "/offline/reader.js"
  to = "/retired-downloads.html"
  status = 404
  force = true

[[redirects]]
  from = "/offline/*"
  to = "/retired-downloads.html"
  status = 404
  force = false

[[redirects]]
  from = "/downloads/*"
  to = "/retired-downloads.html"
  status = 404
  force = true

[[redirects]]
  from = "/downloads"
  to = "/retired-downloads.html"
  status = 404
  force = true

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/planner/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/planner/app/"

[[headers]]
  for = "/planner/app/*"
  [headers.values]
    X-Robots-Tag = "noindex"
