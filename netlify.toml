[build]
  publish = "dist"
  command = "pip install -r requirements-build.txt && python scripts/build_library.py && python scripts/build_offline.py && python scripts/refine_site.py && python scripts/polish_release.py && python scripts/verify_library.py && node scripts/verify_search.cjs && node scripts/verify_ads.cjs && node --check app.js && node --check search.js && node --check ads.js && node --check offline/reader.js && node --check offline/sw.js && python scripts/stage_site.py && python scripts/verify_release.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/Assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The old Brik checklist URL remains accessible during content conversion.
[[redirects]]
  from = "/blackout-checklist-confirmed"
  to = "/blackout-checklist-confirmed.html"
  status = 301
  force = true

# Retire the abandoned Brik homepage experiment without exposing stale branding.
[[redirects]]
  from = "/indexv3.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/offline/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/offline/"

[[headers]]
  for = "/offline/guides.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
